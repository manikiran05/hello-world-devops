apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-world-devops
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/manikiran05/hello-world-devops.git
    targetRevision: main
    path: helm/hello-world-devops

  destination:
    server: https://kubernetes.default.svc
    namespace: hello-world-devops

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true