
name: Reusable SonarQube PR Scan

on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: true
      SONAR_HOST_URL:
        required: true

permissions:
  contents: read

jobs:
  sonarqube:
    name: SonarQube Scan and Quality Gate
    runs-on: [self-hosted, runner-2]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Java
        shell: bash
        run: |
          java -version

      - name: Check Node.js
        shell: bash
        run: |
          node --version
          npm --version

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v5.3.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.sources=.
            -Dsonar.exclusions=**/node_modules/**,**/.next/**,**/coverage/**,**/dist/**,**/build/**

      - name: Wait for SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube result
        if: success()
        shell: bash
        run: |
          echo "SonarQube analysis completed."
          echo "Quality Gate passed."
          echo "Review the analysis in your SonarQube server."
