
name: CI Pipeline

on:
  push:
    branches:
      - "feature/**"

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
      security_scan:
        description: "Select an individual check or run all checks"
        required: true
        type: choice
        default: all
        options:
          - all
          - test
          - sonarqube
          - codeql
          - trivy
          - snyk
          - semgrep
          - gitleaks
          - socket

permissions:
  contents: read
  security-events: write

jobs:
  test:
    name: Test & Quality
    if: |
      github.event_name != 'workflow_dispatch' ||
      inputs.security_scan == 'all' ||
      inputs.security_scan == 'test'
    runs-on: [self-hosted, runner-1]

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Node.js
        run: node --version

      - name: Check npm
        run: npm --version

      - name: Install Dependencies
        run: npm ci

      - name: NJSSCAN
        run: |
          export PATH="$HOME/njsscan-venv/bin:$PATH"
          njsscan --version
          njsscan --json -o njsscan-report.json .

      - name: Biome Check
        run: npm run format:check

      - name: ESLint
        run: npm run lint

  sonarqube:
    name: SonarQube Security Scan
    if: |
      github.event_name != 'workflow_dispatch' ||
      inputs.security_scan == 'all' ||
      inputs.security_scan == 'sonarqube'
    uses: ./.github/workflows/sonarqube.yml
    secrets: inherit

  codeql:
    name: CodeQL Security Scan
    if: |
      github.event_name != 'workflow_dispatch' ||
      inputs.security_scan == 'all' ||
      inputs.security_scan == 'codeql'
    uses: ./.github/workflows/codeql.yml

  trivy:
    name: Trivy Security Scan
    if: |
      github.event_name != 'workflow_dispatch' ||
      inputs.security_scan == 'all' ||
      inputs.security_scan == 'trivy'
    uses: ./.github/workflows/trivy.yml

  snyk:
    name: Snyk Security Scan
    if: |
      github.event_name != 'workflow_dispatch' ||
      inputs.security_scan == 'all' ||
      inputs.security_scan == 'snyk'
    uses: ./.github/workflows/snyk.yml
    secrets: inherit

  semgrep:
    name: Semgrep Security Scan
    if: |
      github.event_name != 'workflow_dispatch' ||
      inputs.security_scan == 'all' ||
      inputs.security_scan == 'semgrep'
    uses: ./.github/workflows/semgrep.yml

  gitleaks:
    name: Gitleaks Security Scan
    if: |
      github.event_name != 'workflow_dispatch' ||
      inputs.security_scan == 'all' ||
      inputs.security_scan == 'gitleaks'
    uses: ./.github/workflows/gitleaks.yml

  socket:
    name: Socket.dev Security Scan
    if: |
      github.event_name != 'workflow_dispatch' ||
      inputs.security_scan == 'all' ||
      inputs.security_scan == 'socket'
    uses: ./.github/workflows/socket.yml
    secrets: inherit

  summary:
    name: CI Summary
    needs:
      - test
      - sonarqube
      - codeql
      - trivy
      - snyk
      - semgrep
      - gitleaks
      - socket

    if: always()
    runs-on: [self-hosted, runner-1]

    defaults:
      run:
        shell: bash

    steps:
      - name: Generate CI Summary
        env:
          TEST_RESULT: ${{ needs.test.result }}
          SONAR_RESULT: ${{ needs.sonarqube.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          TRIVY_RESULT: ${{ needs.trivy.result }}
          SNYK_RESULT: ${{ needs.snyk.result }}
          SEMGREP_RESULT: ${{ needs.semgrep.result }}
          GITLEAKS_RESULT: ${{ needs.gitleaks.result }}
          SOCKET_RESULT: ${{ needs.socket.result }}

        run: |
          {
            echo "# CI Pipeline Report"
            echo
            echo "| Check | Status |"
            echo "|---|---|"
            echo "| Test & Quality | $TEST_RESULT |"
            echo "| SonarQube | $SONAR_RESULT |"
            echo "| CodeQL | $CODEQL_RESULT |"
            echo "| Trivy | $TRIVY_RESULT |"
            echo "| Snyk | $SNYK_RESULT |"
            echo "| Semgrep | $SEMGREP_RESULT |"
            echo "| Gitleaks | $GITLEAKS_RESULT |"
            echo "| Socket.dev | $SOCKET_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"
