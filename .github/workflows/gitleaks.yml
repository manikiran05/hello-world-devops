name: Reusable Gitleaks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks Scan
    runs-on: [self-hosted, runner-1]

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Gitleaks
        run: gitleaks version

      - name: Run Gitleaks
        run: |
          gitleaks detect \
            --source . \
            --report-format json \
            --report-path gitleaks-results.json \
            --redact \
            --exit-code 0

      - name: Check Gitleaks Report
        if: always()
        run: |
          if [ -f gitleaks-results.json ]; then
            echo "Gitleaks report created successfully"
          else
            echo "Gitleaks report was not created"
            exit 1
          fi

      - name: Upload Gitleaks Report
        if: always() && hashFiles('gitleaks-results.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-results
          path: gitleaks-results.json
          if-no-files-found: ignore
