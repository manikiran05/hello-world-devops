name: Socket.dev Security Scan

on:
  workflow_call:
    secrets:
      SOCKET_TOKEN:
        required: true
      SOCKET_ORG:
        required: true

permissions:
  contents: read

jobs:
  socket:
    name: Socket.dev Scan
    runs-on: [self-hosted, runner-2]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Socket CLI
        shell: bash
        run: |
          SOCKET="$HOME/ci-security-lab/tools/node_modules/.bin/socket"

          if [ ! -x "$SOCKET" ]; then
            echo "Socket CLI not found: $SOCKET"
            exit 1
          fi

          "$SOCKET" --version

      - name: Run Socket Scan
        shell: bash
        env:
          SOCKET_CLI_API_TOKEN: ${{ secrets.SOCKET_TOKEN }}
          SOCKET_ORG: ${{ secrets.SOCKET_ORG }}
        run: |
          SOCKET="$HOME/ci-security-lab/tools/node_modules/.bin/socket"

          set +e
          "$SOCKET" scan create . \
            --org "$SOCKET_ORG" \
            > socket-scan-output.txt 2>&1
          scan_status=$?
          set -e

          cat socket-scan-output.txt
          exit "$scan_status"

      - name: Check Socket Report
        if: always()
        shell: bash
        run: |
          if [ -s socket-scan-output.txt ]; then
            echo "Socket scan output created."
          else
            echo "Socket scan output is missing or empty."
            exit 1
          fi

      - name: Upload Socket Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: socket-results
          path: socket-scan-output.txt
          if-no-files-found: ignore
