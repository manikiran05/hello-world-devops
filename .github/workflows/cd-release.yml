name: CD Release

on:
  push:
    branches:
      - main
    # Helm-only updates are verified by Deploy Verify, not rebuilt.
    paths-ignore:
      - "helm/**"

permissions:
  contents: write

concurrency:
  group: cd-release-main
  cancel-in-progress: false

env:
  BACKEND_IMAGE: mkr05/hello-world-devops-backend
  FRONTEND_IMAGE: mkr05/hello-world-devops-frontend

jobs:
  docker-release:
    name: Build, Scan, Push & Update Helm
    outputs:
      image_tag: ${{ steps.image_tag.outputs.tag }}
    runs-on: [self-hosted, runner-1]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set Up Consistent Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Verify Runner Toolchain
        run: |
          set -euo pipefail
          docker --version
          docker scout version
          python3 --version
          git --version

      - name: Docker Login
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$DOCKER_USERNAME" || -z "$DOCKER_PASSWORD" ]]; then
            echo "::error::Docker Hub credentials are missing."
            exit 1
          fi
          echo "$DOCKER_PASSWORD" | docker login \
            --username "$DOCKER_USERNAME" \
            --password-stdin

      - name: Set Image Tag
        id: image_tag
        run: |
          set -euo pipefail
          IMAGE_TAG="${GITHUB_SHA::7}"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "Using image tag: $IMAGE_TAG"

      - name: Build Backend Image
        run: |
          set -euo pipefail
          docker build --pull -t "$BACKEND_IMAGE:$IMAGE_TAG" .

      - name: Build Frontend Image
        run: |
          set -euo pipefail
          docker build --pull -t "$FRONTEND_IMAGE:$IMAGE_TAG" ./frontend

      - name: Frontend Base Image Recommendations
        continue-on-error: true
        run: docker scout recommendations "$FRONTEND_IMAGE:$IMAGE_TAG"

      # Blocking security gates: fail on any HIGH or CRITICAL finding.
      # No image is pushed unless both scans pass.
      - name: Scan Backend Image
        run: |
          set -euo pipefail
          docker scout cves \
            --only-severity critical,high \
            --exit-code \
            "$BACKEND_IMAGE:$IMAGE_TAG"

      - name: Scan Frontend Image
        run: |
          set -euo pipefail
          docker scout cves \
            --only-severity critical,high \
            --exit-code \
            "$FRONTEND_IMAGE:$IMAGE_TAG"

      - name: Push Backend Image
        run: |
          set -euo pipefail
          docker push "$BACKEND_IMAGE:$IMAGE_TAG"

      - name: Push Frontend Image
        run: |
          set -euo pipefail
          docker push "$FRONTEND_IMAGE:$IMAGE_TAG"

      - name: Update Helm Tags on main
        env:
          IMAGE_TAG: ${{ steps.image_tag.outputs.tag }}
        run: |
          set -euo pipefail

          # Start from the latest main so the release commit includes current Helm values.
          git fetch origin main
          git checkout -B deploy-helm-update origin/main

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("helm/hello-world-devops/values.yaml")
          content = path.read_text()
          tag = os.environ["IMAGE_TAG"]

          for section in ("backend", "frontend"):
              pattern = (
                  rf"(?ms)^({section}:\s*\n.*?)"
                  rf"(^[ \t]+tag:\s*)[^\r\n]*"
              )
              content, count = re.subn(
                  pattern,
                  lambda m: m.group(1) + m.group(2) + f'"{tag}"',
                  content,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f"Could not update {section} image tag")

          path.write_text(content)
          print(f"Updated backend and frontend image tags to {tag}")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/hello-world-devops/values.yaml

          if git diff --cached --quiet; then
            echo "Helm image tags already match this release."
          else
            git commit -m "chore: deploy images ${IMAGE_TAG}"
            git push origin HEAD:main
          fi

      - name: Logout from Docker Hub
        if: always()
        run: docker logout

  deployment-smoke-test:
    name: Wait for deployment and smoke-test
    needs: docker-release
    runs-on: [self-hosted, runner-1]
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      NAMESPACE: hello-world-devops
      FRONTEND_SERVICE: hello-world-devops-frontend
      BACKEND_DEPLOYMENT: hello-world-devops-backend
      FRONTEND_DEPLOYMENT: hello-world-devops-frontend
      EXPECTED_BACKEND_IMAGE: mkr05/hello-world-devops-backend:${{ needs.docker-release.outputs.image_tag }}
      EXPECTED_FRONTEND_IMAGE: mkr05/hello-world-devops-frontend:${{ needs.docker-release.outputs.image_tag }}

    steps:
      - name: Check Kubernetes Access
        run: |
          set -euo pipefail
          kubectl version --client
          kubectl config current-context
          kubectl get namespace "$NAMESPACE"

      - name: Wait for Argo CD to Apply New Images
        run: |
          set -euo pipefail

          wait_for_image() {
            local deployment="$1"
            local expected_image="$2"
            local actual_image=""

            echo "Waiting for $deployment to use $expected_image"
            for attempt in $(seq 1 120); do
              actual_image="$(kubectl get deployment "$deployment" \
                -n "$NAMESPACE" \
                -o jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || true)"

              if [[ "$actual_image" == "$expected_image" ]]; then
                echo "$deployment now uses $actual_image"
                return 0
              fi
              sleep 5
            done

            echo "::error::Timed out waiting for $deployment. Expected $expected_image; found $actual_image"
            return 1
          }

          wait_for_image "$BACKEND_DEPLOYMENT" "$EXPECTED_BACKEND_IMAGE"
          wait_for_image "$FRONTEND_DEPLOYMENT" "$EXPECTED_FRONTEND_IMAGE"

      - name: Verify Kubernetes Rollouts
        run: |
          set -euo pipefail
          kubectl rollout status "deployment/$BACKEND_DEPLOYMENT" -n "$NAMESPACE" --timeout=240s
          kubectl rollout status "deployment/$FRONTEND_DEPLOYMENT" -n "$NAMESPACE" --timeout=240s

      - name: Smoke Test Frontend and Backend APIs
        run: |
          set -euo pipefail

          LOG_FILE="$(mktemp)"
          kubectl port-forward --address 127.0.0.1 \
            "service/$FRONTEND_SERVICE" 18080:80 \
            -n "$NAMESPACE" >"$LOG_FILE" 2>&1 &
          PORT_FORWARD_PID=$!

          cleanup() {
            kill "$PORT_FORWARD_PID" 2>/dev/null || true
            wait "$PORT_FORWARD_PID" 2>/dev/null || true
            rm -f "$LOG_FILE"
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --output /dev/null http://127.0.0.1:18080/; then
              ready=1
              break
            fi
            if ! kill -0 "$PORT_FORWARD_PID" 2>/dev/null; then
              cat "$LOG_FILE"
              echo "::error::kubectl port-forward exited unexpectedly"
              exit 1
            fi
            sleep 2
          done

          if [[ "$ready" -ne 1 ]]; then
            cat "$LOG_FILE"
            echo "::error::Frontend did not become reachable"
            exit 1
          fi

          curl --fail --silent --show-error --output /dev/null \
            --write-out "Frontend HTTP status: %{http_code}\n" http://127.0.0.1:18080/
          curl --fail --silent --show-error --output /dev/null \
            --write-out "Backend health HTTP status: %{http_code}\n" http://127.0.0.1:18080/api/health
          curl --fail --silent --show-error --output /dev/null \
            --write-out "Backend readiness HTTP status: %{http_code}\n" http://127.0.0.1:18080/api/ready
