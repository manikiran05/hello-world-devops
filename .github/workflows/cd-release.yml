```yaml
name: CD Release

on:
  push:
    branches:
      - main
    # Prevent the Helm tag commit from triggering another release.
    paths-ignore:
      - "helm/**"

permissions:
  contents: write

# Never cancel an active release.
concurrency:
  group: cd-release-main
  cancel-in-progress: false

env:
  BACKEND_IMAGE: mkr05/hello-world-devops-backend
  FRONTEND_IMAGE: mkr05/hello-world-devops-frontend

jobs:
  docker-release:
    name: Docker Build, Scan, Push & Update Helm Tags
    runs-on: [self-hosted, runner-1]
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Docker Login
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "$DOCKER_USERNAME" || -z "$DOCKER_PASSWORD" ]]; then
            echo "::error::Docker Hub credentials are missing."
            exit 1
          fi

          echo "$DOCKER_PASSWORD" | docker login \
            --username "$DOCKER_USERNAME" \
            --password-stdin

      - name: Set Image Tag
        run: |
          set -euo pipefail
          IMAGE_TAG="${GITHUB_SHA::7}"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "Using image tag: $IMAGE_TAG"

      - name: Build Backend Image
        run: |
          set -euo pipefail
          docker build --pull -t "$BACKEND_IMAGE:$IMAGE_TAG" .

      - name: Build Frontend Image
        run: |
          set -euo pipefail
          docker build --pull -t "$FRONTEND_IMAGE:$IMAGE_TAG" ./frontend

      # Diagnostic only; the security scans below remain blocking.
      - name: Frontend Base Image Recommendations
        continue-on-error: true
        run: |
          docker scout recommendations "$FRONTEND_IMAGE:$IMAGE_TAG"

      # Both scans must pass before either image is pushed.
      - name: Scan Backend Image
        run: |
          set -euo pipefail
          docker scout cves \
            --only-severity critical,high \
            --exit-code \
            "$BACKEND_IMAGE:$IMAGE_TAG"

      - name: Scan Frontend Image
        run: |
          set -euo pipefail
          docker scout cves \
            --only-severity critical,high \
            --exit-code \
            "$FRONTEND_IMAGE:$IMAGE_TAG"

      - name: Push Backend Image
        run: |
          set -euo pipefail
          docker push "$BACKEND_IMAGE:$IMAGE_TAG"

      - name: Push Frontend Image
        run: |
          set -euo pipefail
          docker push "$FRONTEND_IMAGE:$IMAGE_TAG"

      - name: Update Helm Image Tags
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("helm/hello-world-devops/values.yaml")
          content = path.read_text()
          tag = os.environ["IMAGE_TAG"]

          for section in ("backend", "frontend"):
              pattern = (
                  rf"(?ms)^({section}:\s*\n.*?)"
                  rf"(^[ \t]+tag:\s*)[^\r\n]*"
              )

              content, count = re.subn(
                  pattern,
                  lambda m: m.group(1) + m.group(2) + f'"{tag}"',
                  content,
                  count=1,
              )

              if count != 1:
                  raise SystemExit(
                      f"Could not uniquely update {section} image tag "
                      "in values.yaml"
                  )

          path.write_text(content)
          print(f"Updated backend and frontend image tags to {tag}")
          PY

      - name: Commit and Push Helm Changes to Main
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/hello-world-devops/values.yaml

          if git diff --cached --quiet; then
            echo "Helm image tags are already up to date."
            exit 0
          fi

          git commit -m "chore: update Helm image tags to $IMAGE_TAG"
          git push origin HEAD:main

      - name: Logout from Docker Hub
        if: always()
        run: docker logout
```
