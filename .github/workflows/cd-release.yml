name: CD Release

on:
  push:
    branches:
      - main
    # Ignore Helm-only manifest PR merges to prevent a release loop.
    paths-ignore:
      - "helm/**"

permissions:
  contents: write
  pull-requests: write

# Never cancel an active release.
concurrency:
  group: cd-release-main
  cancel-in-progress: false

env:
  BACKEND_IMAGE: mkr05/hello-world-devops-backend
  FRONTEND_IMAGE: mkr05/hello-world-devops-frontend

jobs:
  docker-release:
    name: Docker Build, Scan, Push & Manifest PR
    runs-on: [self-hosted, runner-1]
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Docker Login
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "$DOCKER_USERNAME" || -z "$DOCKER_PASSWORD" ]]; then
            echo "::error::Docker Hub credentials are missing."
            exit 1
          fi

          echo "$DOCKER_PASSWORD" | docker login \
            --username "$DOCKER_USERNAME" \
            --password-stdin

      - name: Set Image Tag
        run: |
          set -euo pipefail
          IMAGE_TAG="${GITHUB_SHA::7}"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "Using image tag: $IMAGE_TAG"

      - name: Build Backend Image
        run: |
          set -euo pipefail
          docker build --pull -t "$BACKEND_IMAGE:$IMAGE_TAG" .

      - name: Build Frontend Image
        run: |
          set -euo pipefail
          docker build --pull -t "$FRONTEND_IMAGE:$IMAGE_TAG" ./frontend

      # Diagnostic only. This does not replace or bypass the security gate.
      - name: Frontend Base Image Recommendations
        continue-on-error: true
        run: |
          docker scout recommendations "$FRONTEND_IMAGE:$IMAGE_TAG"

      # Blocking security gates: fail on any HIGH or CRITICAL finding.
      - name: Scan Backend Image
        run: |
          set -euo pipefail
          docker scout cves \
            --only-severity critical,high \
            --exit-code \
            "$BACKEND_IMAGE:$IMAGE_TAG"

      - name: Scan Frontend Image
        run: |
          set -euo pipefail
          docker scout cves \
            --only-severity critical,high \
            --exit-code \
            "$FRONTEND_IMAGE:$IMAGE_TAG"

      # Push only after both images pass their security scans.
      - name: Push Backend Image
        run: |
          set -euo pipefail
          docker push "$BACKEND_IMAGE:$IMAGE_TAG"

      - name: Push Frontend Image
        run: |
          set -euo pipefail
          docker push "$FRONTEND_IMAGE:$IMAGE_TAG"

      - name: Update Helm Image Tags
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("helm/hello-world-devops/values.yaml")
          content = path.read_text()
          tag = os.environ["IMAGE_TAG"]

          for section in ("backend", "frontend"):
              pattern = (
                  rf"(?ms)^({section}:\s*\n.*?)"
                  rf"(^[ \t]+tag:\s*)[^\r\n]*"
              )
              content, count = re.subn(
                  pattern,
                  lambda m: m.group(1) + m.group(2) + f'"{tag}"',
                  content,
                  count=1,
              )

              if count != 1:
                  raise SystemExit(
                      f"Could not uniquely update {section}.image.tag "
                      "in values.yaml"
                  )

          path.write_text(content)
          print(f"Updated backend and frontend image tags to {tag}")
          PY

      # Open a PR instead of pushing manifest changes directly to main.
      # CD_PR_TOKEN is recommended if the PR must trigger other workflows.
      - name: Open Helm Update Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.CD_PR_TOKEN || secrets.GITHUB_TOKEN }}
          branch: cd/update-image-tags
          base: main
          add-paths: helm/hello-world-devops/values.yaml
          commit-message: "Update image tags to ${{ env.IMAGE_TAG }}"
          title: "Deploy ${{ env.IMAGE_TAG }}: update Helm image tags"
          body: |
            Automated release PR created by the CD Release workflow.

            - Backend image: `${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}`
            - Frontend image: `${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}`
            - Source commit: ${{ github.sha }}

            Both images passed the HIGH/CRITICAL vulnerability scans and
            were pushed before this PR was opened. Merging it makes ArgoCD
            roll out the new tags; the Deploy Verify workflow then smoke-tests it.
          delete-branch: true
