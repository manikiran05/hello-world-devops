name: CD Release

on:
  push:
    branches:
      - main
    # Helm-only updates are verified by Deploy Verify, not rebuilt.
    paths-ignore:
      - "helm/**"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cd-release-main
  cancel-in-progress: false

env:
  BACKEND_IMAGE: mkr05/hello-world-devops-backend
  FRONTEND_IMAGE: mkr05/hello-world-devops-frontend

jobs:
  docker-release:
    name: Docker Build, Scan, Push & Helm PR
    runs-on: [self-hosted, runner-1]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set Up Consistent Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Verify Runner Toolchain
        run: |
          set -euo pipefail
          docker --version
          docker scout version
          python3 --version
          git --version

      - name: Docker Login
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$DOCKER_USERNAME" || -z "$DOCKER_PASSWORD" ]]; then
            echo "::error::Docker Hub credentials are missing."
            exit 1
          fi
          echo "$DOCKER_PASSWORD" | docker login \
            --username "$DOCKER_USERNAME" \
            --password-stdin

      - name: Set Image Tag
        id: image_tag
        run: |
          set -euo pipefail
          IMAGE_TAG="${GITHUB_SHA::7}"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "Using image tag: $IMAGE_TAG"

      - name: Build Backend Image
        run: |
          set -euo pipefail
          docker build --pull -t "$BACKEND_IMAGE:$IMAGE_TAG" .

      - name: Build Frontend Image
        run: |
          set -euo pipefail
          docker build --pull -t "$FRONTEND_IMAGE:$IMAGE_TAG" ./frontend

      - name: Frontend Base Image Recommendations
        continue-on-error: true
        run: docker scout recommendations "$FRONTEND_IMAGE:$IMAGE_TAG"

      # Blocking security gates: fail on any HIGH or CRITICAL finding.
      # No image is pushed unless both scans pass.
      - name: Scan Backend Image
        run: |
          set -euo pipefail
          docker scout cves \
            --only-severity critical,high \
            --exit-code \
            "$BACKEND_IMAGE:$IMAGE_TAG"

      - name: Scan Frontend Image
        run: |
          set -euo pipefail
          docker scout cves \
            --only-severity critical,high \
            --exit-code \
            "$FRONTEND_IMAGE:$IMAGE_TAG"

      - name: Push Backend Image
        run: |
          set -euo pipefail
          docker push "$BACKEND_IMAGE:$IMAGE_TAG"

      - name: Push Frontend Image
        run: |
          set -euo pipefail
          docker push "$FRONTEND_IMAGE:$IMAGE_TAG"

      - name: Update Helm Image Tags
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("helm/hello-world-devops/values.yaml")
          content = path.read_text()
          tag = os.environ["IMAGE_TAG"]

          for section in ("backend", "frontend"):
              pattern = (
                  rf"(?ms)^({section}:\s*\n.*?)"
                  rf"(^[ \t]+tag:\s*)[^\r\n]*"
              )
              content, count = re.subn(
                  pattern,
                  lambda m: m.group(1) + m.group(2) + f'"{tag}"',
                  content,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(
                      f"Could not uniquely update {section}.image.tag "
                      "in values.yaml"
                  )

          path.write_text(content)
          print(f"Updated backend and frontend image tags to {tag}")
          PY

      # Reuses one PR branch: later releases update the existing PR instead
      # of opening a separate PR for every release.
      - name: Open or Update Helm Image Tag PR
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          token: ${{ secrets.CD_PR_TOKEN || secrets.GITHUB_TOKEN }}
          branch: cd/update-image-tags
          base: main
          add-paths: helm/hello-world-devops/values.yaml
          commit-message: "chore: update Helm image tags to ${{ steps.image_tag.outputs.tag }}"
          title: "Deploy ${{ steps.image_tag.outputs.tag }}: update Helm image tags"
          body: |
            Automated Helm image-tag update from the CD Release workflow.

            - Backend image: ${{ env.BACKEND_IMAGE }}:${{ steps.image_tag.outputs.tag }}
            - Frontend image: ${{ env.FRONTEND_IMAGE }}:${{ steps.image_tag.outputs.tag }}
            - Source commit: ${{ github.sha }}

            Both images passed the blocking HIGH/CRITICAL Docker Scout scans
            and were pushed to Docker Hub before this PR was opened.
            Merging this PR allows Argo CD to sync the updated Helm values.
          delete-branch: true

      - name: Logout from Docker Hub
        if: always()
        run: docker logout
