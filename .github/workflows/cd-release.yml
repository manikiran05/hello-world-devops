name: CD Release

on:
  push:
    branches:
      - main
    # The manifest-update PR only touches helm/. Ignoring it here prevents the
    # merge of that PR from triggering another build/release loop. The
    # Deploy Verify workflow handles that merge instead.
    paths-ignore:
      - "helm/**"

# contents: write is needed to push the update branch, pull-requests: write
# to open the PR. Nothing in this workflow pushes directly to main.
permissions:
  contents: write
  pull-requests: write

# Never cancel a release that is already running (half-pushed images, half
# updated manifests). Newer runs wait their turn instead.
concurrency:
  group: cd-release-main
  cancel-in-progress: false

env:
  BACKEND_IMAGE: mkr05/hello-world-devops-backend
  FRONTEND_IMAGE: mkr05/hello-world-devops-frontend

jobs:
  docker-release:
    name: Docker Build, Scan, Push & Manifest PR
    runs-on: [self-hosted, runner-1]
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Docker Login
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$DOCKER_USERNAME" || -z "$DOCKER_PASSWORD" ]]; then
            echo "::error::Docker Hub credentials are missing."
            exit 1
          fi
          echo "$DOCKER_PASSWORD" | docker login \
            --username "$DOCKER_USERNAME" \
            --password-stdin

      - name: Set Image Tag
        run: |
          IMAGE_TAG="${GITHUB_SHA::7}"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "Using image tag: $IMAGE_TAG"

      - name: Build Backend Image
        run: |
          docker build -t "$BACKEND_IMAGE:$IMAGE_TAG" .

      - name: Build Frontend Image
        run: |
          docker build -t "$FRONTEND_IMAGE:$IMAGE_TAG" ./frontend

      # Blocking gates: docker scout exits 2 when it finds critical or high
      # vulnerabilities, which fails the job before anything is pushed.
      - name: Scan Backend Image
        run: |
          docker scout cves \
            --only-severity critical,high \
            --exit-code \
            "$BACKEND_IMAGE:$IMAGE_TAG"

      - name: Scan Frontend Image
        run: |
          docker scout cves \
            --only-severity critical,high \
            --exit-code \
            "$FRONTEND_IMAGE:$IMAGE_TAG"

      # Push only after both images built and passed their scans.
      - name: Push Backend Image
        run: |
          docker push "$BACKEND_IMAGE:$IMAGE_TAG"

      - name: Push Frontend Image
        run: |
          docker push "$FRONTEND_IMAGE:$IMAGE_TAG"

      - name: Update Helm Image Tags
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("helm/hello-world-devops/values.yaml")
          content = path.read_text()
          tag = os.environ["IMAGE_TAG"]

          for section in ("backend", "frontend"):
              pattern = (
                  rf"(?ms)^({section}:\s*\n.*?)"
                  rf"(^[ \t]+tag:\s*)[^\r\n]*"
              )
              content, count = re.subn(
                  pattern,
                  lambda m: m.group(1) + m.group(2) + f'"{tag}"',
                  content,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(
                      f"Could not uniquely update {section}.image.tag "
                      "in values.yaml"
                  )

          path.write_text(content)
          print(f"Updated backend and frontend image tags to {tag}")
          PY

      # Instead of pushing to main, open (or update) a pull request so the
      # manifest change goes through branch protection and review.
      #
      # Note: PRs created with the default GITHUB_TOKEN do not trigger other
      # workflows, so required status checks would never report on this PR.
      # Add a fine-grained PAT (or GitHub App token) as the CD_PR_TOKEN secret
      # so CI runs on it; without it the step falls back to GITHUB_TOKEN.
      - name: Open Helm Update Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.CD_PR_TOKEN || secrets.GITHUB_TOKEN }}
          branch: cd/update-image-tags
          base: main
          add-paths: helm/hello-world-devops/values.yaml
          commit-message: "Update image tags to ${{ env.IMAGE_TAG }}"
          title: "Deploy ${{ env.IMAGE_TAG }}: update Helm image tags"
          body: |
            Automated release PR created by the CD Release workflow.

            - Backend image: `${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}`
            - Frontend image: `${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}`
            - Source commit: ${{ github.sha }}

            Both images were built, scanned (no critical/high findings) and
            pushed before this PR was opened. Merging it makes ArgoCD roll
            the new tag out; the Deploy Verify workflow then smoke-tests it.
          delete-branch: true
