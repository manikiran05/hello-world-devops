name: Reusable Semgrep

on:
  workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    name: Semgrep Security Scan
    runs-on: [self-hosted, runner-6]
    timeout-minutes: 20

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Python
        run: python3 --version

      - name: Check Semgrep
        run: |
          "$HOME/ci-security-lab/tools/python-env/bin/semgrep" --version

      - name: Run Semgrep
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
          SEMGREP_CACHE_DIR: ${{ github.workspace }}/../../cache/semgrep
        run: |
          mkdir -p "$GITHUB_WORKSPACE/semgrep-cache"
          # Blocking gate: any finding of severity ERROR fails the job.
          # The SARIF report is still written and uploaded by later steps.
          "$HOME/ci-security-lab/tools/python-env/bin/semgrep" \
            scan --config auto --severity ERROR --error --sarif \
            --output semgrep-results.sarif .

      - name: Check Semgrep Report
        if: always()
        run: |
          if [ -f semgrep-results.sarif ]; then
            echo "Semgrep report created successfully"
          else
            echo "Semgrep report was not created"
            exit 1
          fi

      - name: Upload Semgrep Results
        if: always() && hashFiles('semgrep-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep-results.sarif

      - name: Upload Semgrep Artifact
        if: always() && hashFiles('semgrep-results.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep-results.sarif
          if-no-files-found: ignore
