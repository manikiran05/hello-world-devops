name: Deploy Verify

# Runs when the release PR (image tag bump) is merged into main, i.e. when
# ArgoCD is about to roll out a new version. Can also be run by hand.
on:
  push:
    branches:
      - main
    paths:
      - "helm/hello-world-devops/values.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-verify
  cancel-in-progress: false

env:
  NAMESPACE: hello-world-devops
  RELEASE: hello-world-devops

jobs:
  smoke-test:
    name: Post-deploy Smoke Test
    runs-on: [self-hosted, runner-1]
    timeout-minutes: 15

    defaults:
      run:
        shell: bash

    steps:
      - name: Require smoke test URL
        env:
          SMOKE_TEST_URL: ${{ vars.SMOKE_TEST_URL }}
        run: |
          if [[ -z "${SMOKE_TEST_URL:-}" ]]; then
            echo "::error::Repository variable SMOKE_TEST_URL is not set."
            echo "Set it to the frontend URL, e.g. http://<node-ip>:<nodePort>"
            exit 1
          fi
          echo "Smoke test target: $SMOKE_TEST_URL"

      # Optional: if kubectl is available on the runner, wait for ArgoCD to
      # sync and the new pods to become ready, so we test the NEW version and
      # not the old pods that are still serving traffic.
      - name: Wait for Kubernetes rollout (if kubectl is available)
        run: |
          if ! command -v kubectl >/dev/null 2>&1; then
            echo "::warning::kubectl not found on runner; relying on endpoint polling only."
            exit 0
          fi

          # ArgoCD polls the repo (default every 3 minutes) before syncing,
          # so give the deployments time to appear/update.
          for deployment in "${RELEASE}-backend" "${RELEASE}-frontend"; do
            kubectl rollout status "deployment/${deployment}" \
              --namespace "$NAMESPACE" \
              --timeout=300s
          done

      - name: Smoke test
        env:
          SMOKE_TEST_URL: ${{ vars.SMOKE_TEST_URL }}
        run: |
          set -uo pipefail

          base="${SMOKE_TEST_URL%/}"
          attempts=30
          delay=15

          # Frontend root, backend liveness and readiness (the latter also
          # checks the database). /api/* goes through the frontend nginx
          # proxy, so this exercises the whole path.
          check() {
            curl --fail --silent --show-error --max-time 10 \
              --output /dev/null "$base$1"
          }

          for i in $(seq 1 "$attempts"); do
            if check "/" && check "/api/health" && check "/api/ready"; then
              echo "Smoke test passed on attempt $i."
              echo "### Deploy Verify: passed" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Attempt $i/$attempts failed; retrying in ${delay}s..."
            sleep "$delay"
          done

          echo "::error::Smoke test failed after $attempts attempts."
          exit 1

      - name: Rollback guidance
        if: failure()
        run: |
          {
            echo "### Deploy Verify: FAILED"
            echo
            echo "The new release did not pass the smoke test."
            echo "Roll back by reverting the latest image tag PR (the commit"
            echo "that changed helm/hello-world-devops/values.yaml) on main;"
            echo "ArgoCD will sync the previous tag back."
          } >> "$GITHUB_STEP_SUMMARY"
