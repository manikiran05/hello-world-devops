
name: Reusable Trivy

on:
  workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
  trivy:
    name: Trivy Security Scan
    runs-on: [self-hosted, runner-4]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Trivy
        shell: bash
        run: |
          TRIVY="$HOME/ci-security-lab/tools/trivy"

          if [ ! -x "$TRIVY" ]; then
            echo "Trivy binary not found at $TRIVY"
            exit 1
          fi

          "$TRIVY" --version

      - name: Validate Source Directories
        shell: bash
        run: |
          set -euo pipefail

          for dir in src frontend/src; do
            if [ ! -d "$dir" ]; then
              echo "ERROR: Source directory '$dir' does not exist."
              exit 1
            fi
          done

          echo "Backend and frontend source directories found."

      - name: Trivy Source Scan
        shell: bash
        run: |
          set -euo pipefail

          TRIVY="$HOME/ci-security-lab/tools/trivy"
          CACHE_DIR="$(mktemp -d)"
          trap 'rm -rf "$CACHE_DIR"' EXIT

          "$TRIVY" fs \
            --cache-dir "$CACHE_DIR" \
            --scanners vuln,secret \
            --format json \
            --output trivy-results.json \
            --exit-code 0 \
            src frontend/src

      - name: Check Trivy Report
        if: always()
        shell: bash
        run: |
          if [ -s trivy-results.json ]; then
            echo "Trivy JSON report created successfully."
          else
            echo "ERROR: Trivy JSON report was not created or is empty."
            exit 1
          fi

      - name: Upload Trivy JSON Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.json
          if-no-files-found: ignore
          retention-days: 7
