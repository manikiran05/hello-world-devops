
name: Reusable Trivy

on:
  workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
  trivy:
    name: Trivy Security Scan
    runs-on: [self-hosted, runner-4]
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Trivy
        shell: bash
        run: |
          TRIVY="$HOME/ci-security-lab/tools/trivy"

          if [ ! -x "$TRIVY" ]; then
            echo "Trivy binary not found at $TRIVY"
            exit 1
          fi

          "$TRIVY" --version

      - name: Validate Source Directories
        shell: bash
        run: |
          set -euo pipefail

          for dir in src frontend/src; do
            if [ ! -d "$dir" ]; then
              echo "ERROR: Source directory '$dir' does not exist."
              exit 1
            fi
          done

      - name: Trivy Backend Source Scan
        shell: bash
        run: |
          set -euo pipefail

          TRIVY="$HOME/ci-security-lab/tools/trivy"
          CACHE_DIR="$(mktemp -d)"
          trap 'rm -rf "$CACHE_DIR"' EXIT

          "$TRIVY" fs \
            --cache-dir "$CACHE_DIR" \
            --scanners vuln,secret \
            --format json \
            --output trivy-backend-results.json \
            --exit-code 0 \
            src

      - name: Trivy Frontend Source Scan
        shell: bash
        run: |
          set -euo pipefail

          TRIVY="$HOME/ci-security-lab/tools/trivy"
          CACHE_DIR="$(mktemp -d)"
          trap 'rm -rf "$CACHE_DIR"' EXIT

          "$TRIVY" fs \
            --cache-dir "$CACHE_DIR" \
            --scanners vuln,secret \
            --format json \
            --output trivy-frontend-results.json \
            --exit-code 0 \
            frontend/src

      - name: Combine Trivy Reports
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          reports = []
          for filename in (
              "trivy-backend-results.json",
              "trivy-frontend-results.json",
          ):
              path = Path(filename)
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"Missing or empty report: {filename}")

              reports.append(json.loads(path.read_text()))

          combined = {
              "SchemaVersion": reports[0].get("SchemaVersion", 2),
              "ArtifactName": "hello-world-devops-source",
              "Results": [
                  result
                  for report in reports
                  for result in report.get("Results", [])
              ],
          }

          Path("trivy-results.json").write_text(
              json.dumps(combined, indent=2) + "\n"
          )
          print("Combined backend and frontend Trivy reports.")
          PY

      - name: Check Trivy Report
        if: always()
        shell: bash
        run: |
          if [ -s trivy-results.json ]; then
            echo "Trivy JSON report created successfully."
          else
            echo "ERROR: Trivy JSON report was not created or is empty."
            exit 1
          fi

      # Blocking gate: fail on fixable HIGH/CRITICAL vulnerabilities or any
      # secret across the whole repo (lockfile, Dockerfile, helm, source).
      # The reports above are always produced and uploaded for review.
      - name: Trivy Gate (HIGH/CRITICAL, fixable only)
        shell: bash
        run: |
          set -euo pipefail

          TRIVY="$HOME/ci-security-lab/tools/trivy"
          CACHE_DIR="$(mktemp -d)"
          trap 'rm -rf "$CACHE_DIR"' EXIT

          "$TRIVY" fs \
            --cache-dir "$CACHE_DIR" \
            --scanners vuln,secret \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --skip-dirs node_modules,frontend/node_modules \
            --exit-code 1 \
            .

      - name: Upload Trivy JSON Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.json
          if-no-files-found: ignore
          retention-days: 7
