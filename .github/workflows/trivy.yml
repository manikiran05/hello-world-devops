name: Reusable Trivy

on:
  workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
  trivy:
    name: Trivy Security Scan
    runs-on: [self-hosted, runner-4]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Trivy
        shell: bash
        run: |
          TRIVY="$HOME/ci-security-lab/tools/trivy"

          if [ ! -x "$TRIVY" ]; then
            echo "Trivy binary not found at $TRIVY"
            exit 1
          fi

          "$TRIVY" --version

      - name: Trivy Filesystem Scan
        shell: bash
        run: |
          "$HOME/ci-security-lab/tools/trivy" fs . \
            --format json \
            --output trivy-results.json \
            --exit-code 0

      - name: Check Trivy Report
        if: always()
        shell: bash
        run: |
          if [ -s trivy-results.json ]; then
            echo "Trivy JSON report created successfully"
          else
            echo "Trivy JSON report was not created or is empty"
            exit 1
          fi

      - name: Upload Trivy JSON Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.json
          if-no-files-found: ignore
